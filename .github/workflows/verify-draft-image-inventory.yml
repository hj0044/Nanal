name: Verify draft image inventory

on:
  push:
    branches: [work/ap008-canonical-automation-rfc]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run verify:site
